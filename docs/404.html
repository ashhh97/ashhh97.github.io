    <script>
      // GitHub Pages SPA 重定向脚本 - 适配子目录部署
      // 项目部署在 /yzPortfolio2025/ 子目录
      (function () {
        // pathSegmentsToKeep = 1 表示保留第一个路径段（仓库名）
        // 例如：/yzPortfolio2025/emall -> 保留 /yzPortfolio2025/
        var pathSegmentsToKeep = 1;
        var l = window.location;

        // 检查是否已经是重定向后的URL格式
        if (l.search.includes("/?/")) {
          // 如果已经是重定向格式，直接返回，让Vue Router处理
          return;
        }

        // 构建重定向URL
        // 从 /yzPortfolio2025/emall 转换为 /yzPortfolio2025/?/emall
        var redirect =
          l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash;

        // 执行重定向
        l.replace(redirect);
      })();
    </script>
